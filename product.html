<!DOCTYPE html>
<html lang="en-CA">
<head>
    <!-- @partial:head-meta -->
    <title>Product – Atlantic Metals</title>
    <meta name="description" content="View product details, live precious metal pricing, and add to cart.">
    <link rel="stylesheet" href="css/core/style.css">
    <link rel="stylesheet" href="css/core/store.css">
    <link rel="stylesheet" href="css/pages/product.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- @partial:cart -->
    <!-- @partial:header -->

    <!-- PRODUCT PAGE -->
    <div class="product-page">

        <!-- Breadcrumb — same position and size as products.html -->
        <div class="breadcrumb" id="breadcrumb"></div>

        <div class="product-detail-inner">

            <!-- ── LEFT: thumbnail strip + main photo, both separate ───── -->
            <div class="product-gallery">

                <!-- Thumbnail column — separate, larger -->
                <div class="gallery-thumbs">
                    <button class="gallery-arrow" id="thumbScrollUp">▲</button>
                    <div class="thumbs-viewport">
                        <div class="thumbs-track" id="thumbsTrack"></div>
                    </div>
                    <button class="gallery-arrow" id="thumbScrollDown">▼</button>
                </div>

                <!-- Main image — separate, slightly smaller -->
                <div class="gallery-main">
                    <img id="mainImage" alt="Product image">
                </div>

            </div>

            <!-- ── RIGHT: pricing table FIRST, then name/price/qty below ── -->
            <div class="product-detail-info">

                <!-- Pricing tiers table at the top -->
                <div id="pricingTable" class="pricing-table-wrap"></div>

                <!-- Name -->
                <h1 id="productName"></h1>

                <!-- Availability -->
                <p id="availability"></p>

                <!-- Live price -->
                <p class="detail-price" id="detailPrice"></p>

                <!-- Qty + Add to Cart -->
                <div class="detail-qty-row">
                    <div class="card-qty">
                        <button class="qty-btn" id="detailQtyDown">−</button>
                        <span class="qty-value" id="detailQty">1</span>
                        <button class="qty-btn" id="detailQtyUp">+</button>
                    </div>
                    <button class="add-to-cart-btn" id="detailCartBtn">
                        Add to Cart
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- @partial:footer -->

    <script src="js/core/data.js" defer></script>
    <script src="js/core/product-images.js" defer></script>
    <script src="js/core/pricing.js" defer></script>
    <script src="js/core/search.js" defer></script>
    <script src="js/core/site.js" defer></script>
    <script src="js/core/cart.js" defer></script>
    <script src="js/core/auth.js" defer></script>
    <script src="js/pages/product.js" defer></script>
</body>
</html>
