<!DOCTYPE html>
<html lang="en-CA">
<head>
    <!-- @partial:head-meta -->
    <title>Sign In – Atlantic Metals</title>
    <meta name="description" content="Sign in or create your Atlantic Metals account to track orders and checkout faster.">
    <link rel="stylesheet" href="css/core/style.css">
    <link rel="stylesheet" href="css/core/store.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- @partial:cart -->
    <!-- @partial:header -->

    <main>
    <div class="auth-page">
        <div class="auth-box">
            <h2>Atlantic Metals</h2>
            <p>Sign in to track orders and save your details</p>
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tabSignIn" data-auth-tab="login">Sign In</button>
                <button type="button" class="auth-tab" id="tabCreate" data-auth-tab="register">Create Account</button>
            </div>

            <div class="auth-form active" id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <div class="auth-error" id="loginError"></div>
                <button type="button" class="auth-submit" id="loginBtn">Sign In</button>
            </div>

            <div class="auth-form" id="registerForm">
                <div class="name-row">
                    <input type="text" id="regFirstName" placeholder="First name" autocomplete="given-name">
                    <input type="text" id="regLastName" placeholder="Last name" autocomplete="last-name">
                </div>
                <input type="email" id="regEmail" placeholder="Email address" autocomplete="email">
                <input type="password" id="regPassword" placeholder="Password (min 6 chars)" autocomplete="new-password">
                <input type="password" id="regConfirm" placeholder="Confirm password" autocomplete="new-password">
                <div class="auth-error" id="registerError"></div>
                <button type="button" class="auth-submit" id="registerBtn">Create Account</button>
            </div>

            <div class="verify-box" id="verifyBox">
                <div class="verify-icon">📬</div>
                <div class="verify-title">Check your email</div>
                <p class="verify-msg">We sent a 6-digit code to<br><span id="verifyEmailDisplay"></span></p>
                <div class="verify-token-row">
                    <input type="text" id="verifyCode" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                    <button type="button" id="verifyBtn">Verify</button>
                </div>
                <div class="auth-error" id="verifyError"></div>
                <button type="button" class="resend-btn" id="resendBtn">Resend code</button>
            </div>
        </div>
    </div>
    </main>

    <!-- @partial:footer -->

    <script src="js/core/data.js" defer></script>
    <script src="js/core/product-images.js" defer></script>
    <script src="js/core/pricing.js" defer></script>
    <script src="js/core/search.js" defer></script>
    <script src="js/core/site.js" defer></script>
    <script src="js/core/cart.js" defer></script>
    <script src="js/core/auth.js" defer></script>
    <script src="js/pages/login.js" defer></script>
</body>
</html>
