<!DOCTYPE html>
<html lang="en-CA">
<head>
    <!-- @partial:head-meta -->
    <title>Shop Precious Metals – Atlantic Metals</title>
    <meta name="description" content="Browse gold, silver, platinum, and palladium coins, bars, and rounds. Filter by metal, weight, and availability.">
    <link rel="stylesheet" href="css/core/style.css">
    <link rel="stylesheet" href="css/core/store.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- @partial:cart -->
    <!-- @partial:header -->

    <div class="store-page">
        <div class="breadcrumb" id="breadcrumb"></div>

        <div class="store-sort-bar">
            <div class="sort-left">
                <span id="productCount" class="product-count">0 Products</span>
                <button type="button" id="clearFilters" class="clear-filters-btn">Clear Filters</button>
            </div>
            <div class="sort-right">
                <div id="sortToggle" class="sort-control">
                    Sort <span id="sortArrow">∨</span>
                </div>
                <div id="sortDropdown" class="sort-dropdown">
                    <div data-sort="priceLow">Price: Low to High</div>
                    <div data-sort="priceHigh">Price: High to Low</div>
                    <div data-sort="weightLow">Weight: Low to High</div>
                    <div data-sort="weightHigh">Weight: High to Low</div>
                </div>
            </div>
        </div>

        <div class="products-page">
            <div class="filters-card">
                <div class="filter-section">
                    <div class="filter-header-toggle">Availability</div>
                    <div class="filter-options">
                        <label>
                            <input type="checkbox" id="availableFilter"> In Stock Only
                        </label>
                    </div>
                </div>
                <div class="filter-section">
                    <div class="filter-header-toggle">Weight</div>
                    <div class="filter-options" id="weightFilterOptions"></div>
                </div>
            </div>
            <div class="products-area">
                <div id="productList" class="product-grid"></div>
            </div>
        </div>
    </div>

    <!-- @partial:footer -->

    <script src="js/core/data.js" defer></script>
    <script src="js/core/product-images.js" defer></script>
    <script src="js/core/pricing.js" defer></script>
    <script src="js/core/search.js" defer></script>
    <script src="js/pages/products.js" defer></script>
    <script src="js/core/site.js" defer></script>
    <script src="js/core/cart.js" defer></script>
    <script src="js/core/auth.js" defer></script>
    <script src="js/pages/products-filter-toggle.js" defer></script>
</body>
</html>
