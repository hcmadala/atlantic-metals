<!DOCTYPE html>
<html lang="en-CA">
<head>
    <!-- @partial:head-meta -->
    <title>My Profile – Atlantic Metals</title>
    <meta name="description" content="Manage your Atlantic Metals account, addresses, orders, and saved cards.">
    <link rel="stylesheet" href="css/core/style.css">
    <link rel="stylesheet" href="css/core/store.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pages/profile.css">
</head>
<body>
    <!-- @partial:cart -->
    <!-- @partial:header -->

<main>

<!-- PAGE -->
<div class="profile-page">
    <div class="profile-header">
        <h1>My <span>Profile</span></h1>
        <button class="signout-btn" data-profile-action="sign-out">Sign Out</button>
    </div>

    <div class="profile-tabs">
        <button class="profile-tab active" data-profile-tab="account">Account</button>
        <button class="profile-tab" data-profile-tab="addresses">Addresses</button>
        <button class="profile-tab" data-profile-tab="cards">Saved Cards</button>
        <button class="profile-tab" data-profile-tab="orders">Orders</button>
    </div>

    <!-- ── ACCOUNT ─────────────────────────────────────────────────────── -->
    <div class="profile-panel active" id="panel-account">

        <div class="profile-card">
            <div class="profile-card-header">
                <h3>Personal Information</h3>
                <button class="edit-btn" id="editInfoBtn" data-profile-action="toggle-info">Edit</button>
            </div>

            <!-- VIEW -->
            <div id="infoView" class="field-grid">
                <div class="field-item">
                    <label>First Name</label>
                    <div class="field-value" id="viewFirstName">Loading…</div>
                </div>
                <div class="field-item">
                    <label>Last Name</label>
                    <div class="field-value" id="viewLastName">Loading…</div>
                </div>
                <div class="field-item">
                    <label>Email</label>
                    <div class="field-value" id="viewEmail">Loading…</div>
                </div>
                <div class="field-item">
                    <label>Phone</label>
                    <div class="field-value" id="viewPhone">Loading…</div>
                </div>
            </div>

            <!-- EDIT -->
            <div id="infoEdit" class="hidden">
                <div class="field-grid">
                    <div class="field-item">
                        <label>First Name</label>
                        <input type="text" id="editFirstName" placeholder="First name">
                    </div>
                    <div class="field-item">
                        <label>Last Name</label>
                        <input type="text" id="editLastName" placeholder="Last name">
                    </div>
                    <div class="field-item field-full">
                        <label>Email</label>
                        <input type="email" id="editEmail" placeholder="Email address">
                    </div>
                    <div class="field-item field-full">
                        <label>Phone <span class="optional-label">(optional)</span></label>
                        <input type="tel" id="editPhone" placeholder="e.g. +1 (902) 555-0100">
                    </div>
                </div>
                <div class="save-row">
                    <button class="save-btn" id="saveInfoBtn" data-profile-action="save-info">Save Changes</button>
                    <button class="cancel-btn" data-profile-action="toggle-info">Cancel</button>
                    <span class="field-msg" id="infoMsg"></span>
                </div>
            </div>
        </div>

        <div class="profile-card">
            <div class="profile-card-header">
                <h3>Password</h3>
                <button class="edit-btn" id="editPwBtn" data-profile-action="toggle-password">Change</button>
            </div>

            <div id="pwView">
                <div class="field-item">
                    <label>Password</label>
                    <div class="field-value">••••••••••••</div>
                </div>
            </div>

            <div id="pwEdit" class="hidden">
                <div class="field-grid">
                    <div class="field-item field-full">
                        <label>Current Password</label>
                        <input type="password" id="currentPw" placeholder="Current password">
                    </div>
                    <div class="field-item">
                        <label>New Password</label>
                        <input type="password" id="newPw" placeholder="Min 6 characters">
                    </div>
                    <div class="field-item">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirmPw" placeholder="Repeat new password">
                    </div>
                </div>
                <div class="save-row">
                    <button class="save-btn" id="savePwBtn" data-profile-action="save-password">Update Password</button>
                    <button class="cancel-btn" data-profile-action="toggle-password">Cancel</button>
                    <span class="field-msg" id="pwMsg"></span>
                </div>
            </div>
        </div>
        <button class="delete-account-btn" id="deleteAccountBtn" data-profile-action="delete-account">
            Delete Account
        </button>
    </div>

    <!-- ── ADDRESSES ───────────────────────────────────────────────────── -->
    <div class="profile-panel" id="panel-addresses">
        <div class="profile-card">
            <div class="profile-card-header">
                <h3>Saved Addresses</h3>
                <button class="edit-btn" data-profile-action="open-address-form">+ Add New</button>
            </div>

            <div class="addr-form" id="addrForm">
                <div class="addr-row">
                    <input type="text" id="addrFirstName" placeholder="First name">
                    <input type="text" id="addrLastName" placeholder="Last name">
                </div>
                <input type="text" id="addrStreet" placeholder="Street address">
                <input type="text" id="addrStreet2" placeholder="Apt, suite, unit (optional)">
                <div class="addr-row">
                    <input type="text" id="addrCity" placeholder="City">
                    <input type="text" id="addrProvince" placeholder="Province / State">
                </div>
                <div class="addr-row">
                    <input type="text" id="addrPostal" placeholder="Postal / ZIP code">
                    <input type="text" id="addrCountry" placeholder="Country" value="Canada">
                </div>
                <input type="tel" id="addrPhone" placeholder="Phone number">
                <div class="save-row">
                    <button class="save-btn" data-profile-action="save-address">Save Address</button>
                    <button class="cancel-btn" data-profile-action="close-address-form">Cancel</button>
                    <span class="field-msg" id="addrMsg"></span>
                </div>
            </div>

            <div class="address-list" id="addressList">
                <div class="empty-state">Loading…</div>
            </div>
        </div>
    </div>

    <!-- ── SAVED CARDS ─────────────────────────────────────────────────── -->
    <div class="profile-panel" id="panel-cards">
        <div class="profile-card">
            <div class="profile-card-header">
                <h3>Saved Cards</h3>
            </div>
            <p class="card-storage-note">Only the last 4 digits are stored. Never your full card number.</p>

            <div class="card-form" id="cardForm">
                <div class="card-row">
                    <div>
                        <label class="card-field-label">Card Brand</label>
                        <select id="cardBrand">
                            <option value="">Select brand…</option>
                            <option value="Visa">Visa</option>
                            <option value="Mastercard">Mastercard</option>
                            <option value="Amex">Amex</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="card-field-label">Last 4 Digits</label>
                        <input type="text" id="cardLast4" placeholder="e.g. 4242" maxlength="4">
                    </div>
                </div>
                <div class="card-row">
                    <div>
                        <label class="card-field-label">Expiry (MM/YY)</label>
                        <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div>
                        <label class="card-field-label">Cardholder Name</label>
                        <input type="text" id="cardName" placeholder="Name on card">
                    </div>
                </div>
                <div class="save-row">
                    <button class="save-btn" data-profile-action="save-card">Save Card</button>
                    <button class="cancel-btn" data-profile-action="close-card-form">Cancel</button>
                    <span class="field-msg" id="cardMsg"></span>
                </div>
            </div>

            <div class="card-list" id="cardList">
                <div class="empty-state">Loading…</div>
            </div>
            <button class="add-btn" id="addCardBtn" data-profile-action="open-card-form">+ Add a card</button>
        </div>
    </div>

    <!-- ── ORDERS ──────────────────────────────────────────────────────── -->
    <div class="profile-panel" id="panel-orders">
        <div class="profile-card">
            <div class="profile-card-header">
                <h3>Order History</h3>
            </div>
            <div class="orders-list" id="ordersList">
                <div class="empty-state">Loading…</div>
            </div>
        </div>
    </div>

</div>
</main>

    <!-- @partial:footer -->

<script src="js/core/data.js" defer></script>
<script src="js/core/product-images.js" defer></script>
<script src="js/core/pricing.js" defer></script>
<script src="js/core/search.js" defer></script>
<script src="js/core/site.js" defer></script>
<script src="js/core/cart.js" defer></script>
<script src="js/core/auth.js" defer></script>
<script src="js/pages/profile.js" defer></script>
</body>
</html>
