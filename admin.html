<!DOCTYPE html>
<html lang="en-CA">
<head>
  <!-- @partial:head-meta -->
  <title>Admin — Atlantic Metals</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pages/admin.css">
</head>
<body>

<div class="admin-header">
  <a href="index.html" class="brand">Atlantic Metals</a>
  <span class="badge">Admin Panel</span>
</div>

<!-- AUTH GATE -->
<div id="authGate" class="is-hidden">
  <h2>Admin Access</h2>
  <p>You must be logged in as an admin to access this page.</p>
  <a href="login.html" class="btn btn-gold admin-login-link">Go to Login →</a>
</div>

<!-- MAIN ADMIN CONTENT -->
<div class="admin-body is-hidden" id="adminContent">

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-pill"><span class="num" id="statTotal">—</span>Total Coins</div>
    <div class="stat-pill"><span class="num" id="statWithImages">—</span>With Images</div>
    <div class="stat-pill"><span class="num" id="statNoImages">—</span>Missing Images</div>
  </div>

  <!-- Add Coin Form -->
  <div class="panel">
    <div class="section-title">Add <span>Inventory Item</span></div>
    <div class="form-grid">
      <div>
        <label>SKU *</label>
        <input type="text" id="fSku" placeholder="gold-eagle-1oz">
      </div>
      <div>
        <label>Name *</label>
        <input type="text" id="fName" placeholder="1 oz Canadian Gold Maple Leaf">
      </div>
      <div>
        <label>Metal *</label>
        <select id="fMetal">
          <option value="">Select metal</option>
          <option value="gold">Gold</option>
          <option value="silver">Silver</option>
          <option value="platinum">Platinum</option>
          <option value="palladium">Palladium</option>
        </select>
      </div>
      <div>
        <label>Type *</label>
        <select id="fType">
          <option value="coins">Coins</option>
          <option value="bars">Bars</option>
          <option value="rounds">Rounds</option>
        </select>
      </div>
      <div>
        <label>Mint</label>
        <input type="text" id="fMint" placeholder="Royal Canadian Mint">
      </div>
      <div>
        <label>Weight (oz)</label>
        <input type="number" id="fWeight" placeholder="1.0" step="0.001">
      </div>
      <div>
        <label>Purity</label>
        <input type="text" id="fPurity" placeholder=".9999">
      </div>
      <div>
        <label>Year</label>
        <input type="number" id="fYear" placeholder="2025">
      </div>
      <div>
        <label>QOH</label>
        <input type="number" id="fQoh" placeholder="0" min="0" step="1" value="0">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-gold" id="addCoinBtn">+ Add Item</button>
      <span id="addStatus" class="form-status"></span>
    </div>
  </div>

  <!-- Coins List -->
  <div class="section-title">All <span>Inventory</span></div>
  <div class="admin-toolbar">
    <input type="text" id="inventorySearch" placeholder="Search name, SKU, mint">
    <select id="inventoryTypeFilter">
      <option value="">All types</option>
      <option value="coins">Coins</option>
      <option value="bars">Bars</option>
      <option value="rounds">Rounds</option>
    </select>
    <select id="inventoryStockFilter">
      <option value="">All stock</option>
      <option value="in">In stock</option>
      <option value="out">Out of stock</option>
      <option value="missing-image">Missing image</option>
    </select>
  </div>
  <div class="coins-grid" id="coinsGrid">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      Loading coins...
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"><span class="dot"></span><span id="toastMsg"></span></div>
<script src="js/pages/admin.js" defer></script>
</body>
</html>
